name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  onboarding:
    name: Onboarding simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test

  assistant:
    name: Local assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
        working-directory: assistant
      - run: python -m compileall -q home_ai tests
        working-directory: assistant
      - run: python -m unittest discover -s tests -v
        working-directory: assistant
      - run: python -m pip check
        working-directory: assistant
      - run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as package:
              assets = set(package.namelist())
          expected = {
              "home_ai/web/index.html",
              "home_ai/web/app.js",
              "home_ai/web/styles.css",
          }
          missing = expected - assets
          if missing:
              raise SystemExit(f"wheel is missing web assets: {sorted(missing)}")
          PY
        working-directory: assistant
